name: Verilator

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator g++

      - name: Regression (lint + Verilator smoke)
        working-directory: ${{ github.workspace }}
        run: make regress
